version: 2
updates:
  # Keeps the SHA-pinned workflow actions current. Updates arrive as reviewable PRs only.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
  # Python dependencies are updated deliberately (see docs/DEVELOPMENT.md), not on a stream.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      python-dependencies:
        patterns: ["*"]
